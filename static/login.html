<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News_idea 로그인</title><link rel="stylesheet" href="/login.css"></head>
<body data-mode="login"><main><section class="intro"><a class="brand" href="/login"><span>N</span> News_idea</a><p class="eyebrow">YOUR NEXT CHAPTER</p><h1>다음 기회를 위한<br>나만의 기록.</h1><p>채용 일정부터 이력서, 배움의 기록까지.<br>필요할 때 꺼내 보는 개인 커리어 공간입니다.</p><div class="features"><span>채용 캘린더</span><span>이력서 · 메모</span><span>학습 기록</span></div></section><section class="card" aria-labelledby="formTitle"><p class="eyebrow">PERSONAL WORKSPACE</p><h2 id="formTitle">로그인</h2><p id="formDescription" class="muted">내 기록을 이어서 정리하세요.</p><form id="login"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" autocapitalize="none" spellcheck="false" aria-describedby="usernameHint"><small id="usernameHint">영문·숫자·밑줄 3~32자, 대소문자 구분 없음</small><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><div id="confirmationGroup" hidden><label for="confirmation">비밀번호 확인</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" maxlength="1024"><small>비밀번호는 10자 이상 입력하세요.</small></div><p id="error" role="alert" aria-live="polite"></p><button id="submit" type="submit">로그인</button></form><p class="switch"><span id="switchText">처음 방문하셨나요?</span> <a id="switchLink" href="/signup">회원가입</a></p><p class="privacy">개인 기록은 라즈베리파이 서버에 저장됩니다.<br>다른 회원에게는 공개되지 않습니다.</p></section></main><script src="/login.js"></script></body></html>
